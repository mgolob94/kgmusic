services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kgmusic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?nastavi POSTGRES_PASSWORD v .env}
      POSTGRES_DB: kgmusic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kgmusic -d kgmusic"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kgmusic:${POSTGRES_PASSWORD}@db:5432/kgmusic
      SESSION_SECRET: ${SESSION_SECRET:?nastavi SESSION_SECRET v .env}
      # Neobvezno: prvi račun se ustvari ob zagonu. Sicer se uporabniki registrirajo sami.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      INVITE_CODE: ${INVITE_CODE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TZ: Europe/Ljubljana
    # Samo lokalno; javno ga izpostavi nginx z HTTPS (deploy/nginx.conf.example).
    ports:
      - "127.0.0.1:3009:3000"

volumes:
  pgdata:
