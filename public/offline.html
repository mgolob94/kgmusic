<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ni povezave · KG Music</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      font-family: system-ui, sans-serif; background: #f3f5f1; color: #16212b; }
    @media (prefers-color-scheme: dark) { body { background: #0f161b; color: #e8edf0; } }
    main { max-width: 22rem; text-align: center; }
    h1 { font-family: Georgia, serif; font-size: 1.75rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.25rem; line-height: 1.5; opacity: .85; }
    button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #1d5b63; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 2px solid #1d5b63; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Ni povezave</h1>
    <p>Podatki o učencih se zaradi varnosti ne shranjujejo v napravi. Ko bo povezava spet na voljo, poskusite znova.</p>
    <button type="button" onclick="location.reload()">Poskusi znova</button>
  </main>
</body>
</html>
